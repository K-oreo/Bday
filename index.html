<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Happy Birthday, Qasim!</title>
<style>
  :root{
    --pw: clamp(155px, 42vw, 330px);
    --ph: calc(var(--pw) * 1131 / 800);
    --ink: #6b4a2b;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color:#cbaf82;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.16), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(0,0,0,0.10), transparent 55%),
      repeating-linear-gradient(120deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 2px, transparent 2px, transparent 5px),
      linear-gradient(180deg, #d3ba90, #c2a377);
    overflow-x:hidden;
    color:var(--ink);
  }

  .stage{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    padding-top: 9vh;
    padding-bottom: 6vh;
    perspective: 2400px;
  }

  /* ---------- Book ---------- */
  .book{
    position:relative;
    width: var(--pw);
    height: var(--ph);
    transition: width .9s cubic-bezier(.65,.05,.36,1);
  }
  .book.open{ width: calc(var(--pw) * 2); }

  .page{
    position:absolute;
    top:0;
    width: var(--pw);
    height: var(--ph);
    border-radius: 10px;
    overflow:hidden;
    box-shadow: 0 18px 40px rgba(40,20,5,0.35), 0 2px 6px rgba(40,20,5,0.2);
    background:#efe4cf;
  }
  .page-left{ left:0; pointer-events:none; }
  .page-right{
    left: var(--pw);
    opacity:0;
    transform: translateX(-14px);
    transition: opacity .6s ease .28s, transform .6s ease .28s;
    pointer-events:none;
  }
  .book.open .page-left{ pointer-events:auto; cursor:pointer; }
  .book.open .page-right{ opacity:1; transform:none; pointer-events:auto; }

  .page-bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }

  /* spine shadow between pages */
  .spine-shadow{
    position:absolute;
    top:0; left:var(--pw);
    width:22px; height:var(--ph);
    transform: translateX(-11px);
    background: linear-gradient(90deg, rgba(0,0,0,0.28), rgba(0,0,0,0) 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.28));
    opacity:0;
    transition: opacity .6s ease .3s;
    pointer-events:none;
    z-index:4;
  }
  .book.open .spine-shadow{ opacity:1; }

  /* ---------- Cover ---------- */
  .cover{
    position:absolute;
    left:0; top:0;
    width: var(--pw); height: var(--ph);
    border-radius:10px;
    overflow:hidden;
    transform-origin: left center;
    transition: transform .9s cubic-bezier(.65,.05,.36,1);
    box-shadow: 0 18px 45px rgba(40,20,5,0.4), 0 2px 6px rgba(40,20,5,0.25);
    z-index:6;
    cursor:pointer;
    backface-visibility:hidden;
    animation: breathe 3.6s ease-in-out infinite;
  }
  .book.open .cover{ transform: rotateY(-172deg); pointer-events:none; animation:none; }
  .cover img{
    width:100%; height:100%; object-fit:cover; display:block;
    user-select:none; -webkit-user-drag:none;
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1) rotate(0deg); }
    50%{ transform: scale(1.012) rotate(-0.3deg); }
  }
  .book.open .cover{ animation:none; }

  .open-hint{
    position:absolute;
    left:50%;
    bottom: -34px;
    transform: translateX(-50%);
    font-size: 13px;
    letter-spacing:.02em;
    color: #6b4a2b;
    background: rgba(255,255,255,0.55);
    padding: 5px 12px;
    border-radius: 999px;
    white-space:nowrap;
    animation: pulse 2.2s ease-in-out infinite;
    pointer-events:none;
  }
  .book.open .open-hint{ display:none; }
  @keyframes pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }

  /* ---------- Back to cover button ---------- */
  .back-btn{
    position:fixed;
    top: 3vh;
    left:50%;
    transform: translateX(-50%);
    display:none;
    align-items:center;
    gap:6px;
    background: #7a3b2e;
    color:#fbf3e6;
    border:none;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight:600;
    letter-spacing:.01em;
    cursor:pointer;
    box-shadow: 0 6px 16px rgba(40,20,5,0.35);
    z-index: 50;
  }
  .back-btn:hover{ background:#8c473a; }
  .book.open ~ .back-btn{ display:flex; }

  /* ---------- Letter page ---------- */
  .letter-el{
    position:absolute;
    left:50%;
    top:60%;
    width:44%;
    transform: translate(-50%, -18%) scale(0.5) rotate(-4deg);
    transform-origin: 50% 15%;
    opacity: 0;
    transition: all .65s cubic-bezier(.34,1.25,.4,1);
    filter: drop-shadow(0 10px 18px rgba(30,15,5,0.35));
    pointer-events:none;
  }
  .page-left.lifted .letter-el{
    left:50%; top:9%;
    width:76%;
    transform: translate(-50%,0) scale(1) rotate(0.5deg);
    opacity:1;
  }
  .letter-tap-hint{
    position:absolute;
    left:50%; bottom:6%;
    transform: translateX(-50%);
    font-size:12px;
    color:#7a5a35;
    background: rgba(255,255,255,0.6);
    padding:4px 10px;
    border-radius:999px;
    pointer-events:none;
    transition: opacity .3s ease;
  }
  .page-left.lifted .letter-tap-hint{ opacity:0; }

  /* ---------- Candles page ---------- */
  .flame{
    position:absolute;
    pointer-events:none;
    will-change: transform;
    z-index:3;
  }
  .flame img, .flame{ display:block; }

  .meter-wrap{
    width: 100%;
    max-width: 220px;
    height: 8px;
    background: rgba(122,59,46,0.15);
    border: 1px solid rgba(90,55,20,0.3);
    border-radius: 999px;
    overflow:hidden;
  }
  .meter-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, #6fbf8f, #f4c150, #e85f5f);
    transition: width .06s linear;
  }

  .blow-panel{
    position:fixed;
    left:50%;
    bottom: 3vh;
    transform: translateX(-50%);
    z-index: 50;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:8px;
    background: rgba(255,248,235,0.92);
    border: 1px solid rgba(122,59,46,0.18);
    padding: 12px 18px;
    border-radius: 16px;
    box-shadow: 0 10px 24px rgba(40,20,5,0.22);
    width: min(84vw, 260px);
  }
  .book.open ~ .blow-panel{ display:flex; }
  .blow-btn{
    background:#7a3b2e;
    color:#fbf3e6;
    border:none;
    padding: 8px 20px;
    border-radius: 999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    user-select:none;
    box-shadow: 0 4px 10px rgba(40,20,5,0.3);
    white-space:nowrap;
  }
  .blow-btn:active{ background:#5f2c22; transform: scale(0.97); }
  .mic-note{
    font-size: 10.5px;
    color:#7a5a35;
    text-align:center;
    line-height:1.35;
    display:none;
  }
  .mic-note.show{ display:block; }

  .wish-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    background: rgba(255,248,235,0.0);
    opacity:0;
    pointer-events:none;
    transition: opacity .5s ease, background .5s ease;
    z-index:8;
    text-align:center;
    padding: 0 8%;
  }
  .wish-overlay.show{
    opacity:1;
    pointer-events:auto;
    background: rgba(255,248,235,0.42);
  }
  .wish-text{
    font-size: clamp(16px, 4.6vw, 22px);
    font-weight:700;
    color:#7a3b2e;
    text-shadow: 0 2px 8px rgba(255,255,255,0.8);
  }
  .relight-btn{
    background:#7a3b2e;
    color:#fbf3e6;
    border:none;
    padding: 9px 18px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    box-shadow: 0 6px 14px rgba(40,20,5,0.3);
  }
  .relight-btn:hover{ background:#8c473a; }

  #confettiCanvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    pointer-events:none;
    z-index: 999;
  }

  .footer-note{
    position:fixed;
    bottom: 8px;
    left:50%;
    transform: translateX(-50%);
    font-size: 10.5px;
    color: rgba(107,74,43,0.65);
    text-align:center;
    width: 92%;
    z-index: 40;
    transition: opacity .3s ease;
  }
  body.book-open .footer-note{ display:none; }

  @media (max-width: 380px){
    .stage{ padding-top:7vh; }
  }
</style>
</head>

    <button class="back-btn" id="backBtn">‹ back to cover</button>

    <div class="blow-panel">
      <div class="meter-wrap" id="meterWrap"><div class="meter-fill" id="meterFill"></div></div>
      <button class="blow-btn" id="blowBtn">Hold to blow</button>
      <div class="mic-note" id="micNote">Blow into your mic, or hold the button (or spacebar).</div>
    </div>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <div class="footer-note">This card needs to be hosted online (https) for mic blowing to work — the hold-to-blow button always works.</div>

<script>
(function(){
  "use strict";

  var book = document.getElementById('book');
  var cover = document.getElementById('cover');
  var backBtn = document.getElementById('backBtn');
  var pageLeft = document.getElementById('pageLeft');
  var pageRight = document.getElementById('pageRight');
  var letterEl = document.getElementById('letterEl');
  var letterHint = document.getElementById('letterHint');

  var flameIds = ['flame1','flame2','flame3'];
  var flameEls = flameIds.map(function(id){ return document.getElementById(id); });
  var activeFlames = flameEls.slice(); // flames currently lit & animated

  var meterFill = document.getElementById('meterFill');
  var blowBtn = document.getElementById('blowBtn');
  var micNote = document.getElementById('micNote');
  var wishOverlay = document.getElementById('wishOverlay');
  var relightBtn = document.getElementById('relightBtn');

  var micRequested = false;
  var micActive = false;
  var audioCtx = null, analyser = null, dataArray = null;

  var holding = false;
  var blowAccum = 0; // ms
  var THRESH = 0.11;
  var BLOW_MS = 500;
  var extinguished = false;
  var lastT = null;

  /* ---------------- Book open / close ---------------- */
  function openBook(){
    book.classList.add('open');
    document.body.classList.add('book-open');
    if(!micRequested){
      micRequested = true;
      initMic();
    }
  }
  function closeBook(){
    book.classList.remove('open');
    document.body.classList.remove('book-open');
    pageLeft.classList.remove('lifted');
    resetCandles();
  }
  cover.addEventListener('click', openBook);
  backBtn.addEventListener('click', closeBook);

  /* ---------------- Letter interaction ---------------- */
  pageLeft.addEventListener('click', function(){
    pageLeft.classList.toggle('lifted');
  });

  /* ---------------- Mic setup ---------------- */
  function initMic(){
    if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showMicUnavailable();
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation:false, noiseSuppression:false, autoGainControl:false
    }}).then(function(stream){
      try{
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.fftSize);
        micActive = true;
        if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
      }catch(e){
        showMicUnavailable();
      }
    }).catch(function(){
      showMicUnavailable();
    });
  }
  function showMicUnavailable(){
    micActive = false;
    micNote.textContent = "Mic isn't available here — hold the button (or spacebar) to blow out the candles.";
    micNote.classList.add('show');
  }

  function getMicVolume(){
    if(!micActive || !analyser) return 0;
    analyser.getByteTimeDomainData(dataArray);
    var sum = 0;
    for(var i=0;i<dataArray.length;i++){
      var v = (dataArray[i]-128)/128;
      sum += v*v;
    }
    return Math.sqrt(sum/dataArray.length);
  }

  /* ---------------- Hold-to-blow fallback ---------------- */
  function setHolding(v){ holding = v; }
  blowBtn.addEventListener('mousedown', function(e){ e.preventDefault(); setHolding(true); });
  blowBtn.addEventListener('touchstart', function(e){ e.preventDefault(); setHolding(true); }, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(function(ev){
    blowBtn.addEventListener(ev, function(){ setHolding(false); });
  });
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' && book.classList.contains('open') && !extinguished){
      e.preventDefault();
      setHolding(true);
    }
  });
  window.addEventListener('keyup', function(e){
    if(e.code === 'Space'){ setHolding(false); }
  });

  /* ---------------- Flame animation + blow logic ---------------- */
  function updateFlames(vol, t){
    var idlePhaseBase = t/280;
    activeFlames.forEach(function(el, i){
      var idle = Math.sin(idlePhaseBase + i*1.7) * 3;
      var bend = Math.min(1, vol/0.5);
      var angle = idle + bend*26;
      var driftX = bend*7;
      var scale = 1 - bend*0.06;
      el.style.transform = 'translateX('+driftX.toFixed(2)+'px) rotate('+angle.toFixed(2)+'deg) scale('+scale.toFixed(3)+')';
    });
  }

  function extinguishFlame(el, delay){
    setTimeout(function(){
      el.style.transition = 'transform .5s cubic-bezier(.4,0,.2,1), opacity .5s ease';
      el.style.transform = 'translateY(-16px) scale(0.15) rotate(34deg)';
      el.style.opacity = '0';
    }, delay);
  }

  function extinguishAll(){
    if(extinguished) return;
    extinguished = true;
    var order = flameEls.slice();
    order.forEach(function(el, i){ extinguishFlame(el, i*130); });
    activeFlames = [];
    var totalDelay = order.length*130 + 480;
    setTimeout(function(){
      wishOverlay.classList.add('show');
      launchConfetti();
    }, totalDelay);
  }

  function resetCandles(){
    extinguished = false;
    blowAccum = 0;
    holding = false;
    wishOverlay.classList.remove('show');
    flameEls.forEach(function(el){
      el.style.transition = 'none';
      el.style.opacity = '1';
      el.style.transform = 'translateX(0) rotate(0deg) scale(1)';
    });
    activeFlames = flameEls.slice();
  }
  relightBtn.addEventListener('click', function(e){
    e.stopPropagation();
    resetCandles();
  });

  /* ---------------- Main loop ---------------- */
  function loop(t){
    requestAnimationFrame(loop);
    if(lastT === null) lastT = t;
    var dt = t - lastT;
    lastT = t;

    var vol = holding ? 1 : getMicVolume();
    meterFill.style.width = Math.min(100, vol*230) + '%';

    if(!extinguished){
      updateFlames(vol, t);
      if(vol > THRESH){
        blowAccum += dt;
      } else {
        blowAccum = Math.max(0, blowAccum - dt*2);
      }
      if(blowAccum >= BLOW_MS){
        extinguishAll();
      }
    }
  }
  requestAnimationFrame(loop);

  /* ---------------- Confetti ---------------- */
  var canvas = document.getElementById('confettiCanvas');
  var ctx = canvas.getContext('2d');
  var confettiParticles = [];
  var confettiRunning = false;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas(){
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  var confettiColors = ['#e9556a','#f6a623','#4fb3a9','#7c6ff0','#ffd166','#ef476f','#6fbf8f'];

  function launchConfetti(){
    confettiParticles = [];
    var W = window.innerWidth;
    var H = window.innerHeight;
    var count = Math.min(150, Math.max(90, Math.round(W/6)));
    for(var i=0;i<count;i++){
      confettiParticles.push({
        x: Math.random()*W,
        y: -20 - Math.random()*H*0.6,
        vx: (Math.random()-0.5)*1.6,
        vy: 2 + Math.random()*2.6,
        rot: Math.random()*360,
        vrot: (Math.random()-0.5)*10,
        size: 5 + Math.random()*6,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        shape: Math.random() < 0.5 ? 'rect' : 'circle',
        born: performance.now(),
        life: 3800 + Math.random()*1800
      });
    }
    if(!confettiRunning){
      confettiRunning = true;
      requestAnimationFrame(confettiLoop);
    }
  }

  function confettiLoop(now){
    ctx.clearRect(0,0,window.innerWidth, window.innerHeight);
    var alive = false;
    confettiParticles.forEach(function(p){
      var age = now - p.born;
      if(age > p.life) return;
      alive = true;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      var fadeStart = p.life*0.75;
      var alpha = age < fadeStart ? 1 : Math.max(0, 1 - (age-fadeStart)/(p.life-fadeStart));
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      if(p.shape === 'rect'){
        ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.66);
      } else {
        ctx.beginPath();
        ctx.arc(0,0,p.size/2,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    });
    if(alive){
      requestAnimationFrame(confettiLoop);
    } else {
      confettiRunning = false;
      ctx.clearRect(0,0,window.innerWidth, window.innerHeight);
    }
  }

})();
</script>
